name: Build and Publish multi-arch Docker Image

on:
  push:
    branches:
      - save-tribute
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (для эмуляции arm64 на x86)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image names to lowercase
        id: image_names
        run: |
          echo "ghcr_image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=docker.io/${DOCKERHUB_USERNAME,,}/${GITHUB_REPOSITORY_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image_names.outputs.ghcr_image }}:latest
            ${{ steps.image_names.outputs.ghcr_image }}:${{ github.ref_name }}
            ${{ steps.image_names.outputs.dockerhub_image }}:latest
            ${{ steps.image_names.outputs.dockerhub_image }}:${{ github.ref_name }}
